name: Build release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          else
            echo "RELEASE_KEYSTORE_BASE64 secret is not set; release APK will not be signed."
          fi

      - name: Build debug APK
        env:
          OVERCAST_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          OVERCAST_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OVERCAST_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: overcast-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
